services:
  mysql:
    image: mysql:8.0
    container_name: ticketbook-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ticketbook_db
      MYSQL_USER: ticketbook_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ticketbook-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketbook_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ticketbook_user
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-real-32-byte-plus-secret-in-.env}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
